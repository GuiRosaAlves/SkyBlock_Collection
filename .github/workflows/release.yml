name: Publish SkyVoid release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build SkyVoid datapacks with Beet
        run: |
          uv sync --frozen
          uv run beet -p beet-release.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build and verify NeoForge jar
        run: gradle check build --no-daemon -PskyvoidPackDir=build
      - name: Assemble release assets and checksums
        shell: bash
        run: |
          mkdir release-assets
          find build -maxdepth 1 -type f -name '*.zip' -exec cp {} release-assets/ \;
          find build/bundled -maxdepth 1 -type f -name '*.zip' -exec cp {} release-assets/ \;
          cp build/libs/skyvoid-*.jar release-assets/
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'skyvoid-*.jar' | wc -l)" -eq 1
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes
          fi

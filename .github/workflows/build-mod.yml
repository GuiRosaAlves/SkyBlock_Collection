name: Build SkyVoid NeoForge mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package and validate (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build SkyVoid datapacks with Beet
        run: |
          uv sync --frozen
          uv run beet -c beet-release.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build and verify NeoForge jar
        run: gradle check build --no-daemon -PskyvoidPackDir=build
      - uses: actions/upload-artifact@v4
        with:
          name: skyvoid-neoforge-${{ github.sha }}
          path: build/libs/skyvoid-*.jar
          if-no-files-found: error
